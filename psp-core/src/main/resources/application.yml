server:
  port: 8081

spring:
  application:
    name: psp-core
  # Tajne se citaju iz psp-core/.env (nije na git-u); sablon je u .env.example
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/psp
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${psp.keycloak.server-url}/realms/${psp.keycloak.realm}

psp:
  keycloak:
    server-url: http://localhost:8180
    realm: psp
    client-id: psp-core
    client-secret: ${PSP_CORE_CLIENT_SECRET}
  dashboard:
    allowed-origin: http://localhost:5173
