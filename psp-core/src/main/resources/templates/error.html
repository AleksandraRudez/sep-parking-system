<!doctype html>
<html lang="sr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Greška</title>
  <link rel="stylesheet" th:href="@{/checkout/assets/checkout.css}">
</head>
<body>
<main class="card">
  <div class="brand">PSP · Sigurno plaćanje</div>
  <h1>Zahtev nije moguće obraditi</h1>
  <p class="message" th:if="${status == 403}">Sesija je istekla ili zahtev nije važeći. Vratite se na prodavnicu i pokušajte ponovo.</p>
  <p class="message" th:if="${status == 404}">Stranica ne postoji.</p>
  <p class="message" th:unless="${status == 403 or status == 404}">Došlo je do greške. Pokušajte ponovo kasnije.</p>
</main>
</body>
</html>
