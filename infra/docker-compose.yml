# Zajednicka infrastruktura za lokalni razvoj.
# Pre prvog pokretanja: kopirati .env.example u .env i popuniti vrednosti.
# Pokretanje (iz foldera infra):  docker compose up -d
services:
  postgres:
    image: postgres:16.4
    container_name: sep-postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: sep-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      PSP_SUPERADMIN_PASSWORD: ${PSP_SUPERADMIN_PASSWORD}
      PSP_CORE_CLIENT_SECRET: ${PSP_CORE_CLIENT_SECRET}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${DB_USERNAME}
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KC_HTTP_PORT: 8180
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak/psp-realm.json:/opt/keycloak/data/import/psp-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
